volumes:
  valkey-data:
    driver: local

services:
  valkey:
    image: "valkey/valkey:${VALKEY_VERSION:-9.1.3}"
    ports:
      # Published on the loopback interface only. Override the host port in a .env file, see .env.example.
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379/tcp"
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning
